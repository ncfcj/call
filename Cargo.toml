[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/api-client",
    "crates/core",
    "crates/voice",
    "server",
    "web",
    "desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
# Nenhum crate do workspace vai para o crates.io.
publish = false

# Regras de análise estática de todos os crates. O CI roda o clippy com -D warnings, então
# qualquer violação quebra o build. Veja docs/qualidade.md.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Restos de depuração e código inacabado não entram.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Conversões e aritmética que podem perder ou estourar sem avisar.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
# Clareza.
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
uninlined_format_args = "warn"
large_futures = "warn"

[workspace.dependencies]
# Crates do workspace
proto = { path = "crates/proto" }
api-client = { path = "crates/api-client" }
call-core = { path = "crates/core" }
voice = { path = "crates/voice" }

# Compartilhadas
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

# Client (wasm32)
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"

# Argon2 sem otimização leva segundos por hash; otimiza só ele no perfil de dev.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# O release padrão é otimizado para o servidor (velocidade).
# O client usa o perfil `wasm-release` (tamanho), selecionado em web/index.html.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
