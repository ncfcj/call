[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/api-client",
    "crates/core",
    "crates/voice",
    "server",
    "web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Crates do workspace
proto = { path = "crates/proto" }
api-client = { path = "crates/api-client" }
call-core = { path = "crates/core" }
# voice = { path = "crates/voice" }  # volta na Fase 2, quando o web depender dele

# Compartilhadas
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

# Client (wasm32)
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# wasm-bindgen = "0.2"  # volta na Fase 2, com o crate voice

# Argon2 sem otimização leva segundos por hash; otimiza só ele no perfil de dev.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# O release padrão é otimizado para o servidor (velocidade).
# O client usa o perfil `wasm-release` (tamanho), selecionado em web/index.html.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
