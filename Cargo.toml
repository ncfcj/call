[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/api-client",
    "crates/core",
    "crates/voice",
    "server",
    "web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Crates do workspace
proto = { path = "crates/proto" }
api-client = { path = "crates/api-client" }
call-core = { path = "crates/core" }
voice = { path = "crates/voice" }

# Compartilhadas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

# Client (wasm32)
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"

# O release padrão é otimizado para o servidor (velocidade).
# O client usa o perfil `wasm-release` (tamanho), selecionado em web/index.html.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
