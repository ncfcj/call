# Configuração do cargo-mutants (testes de mutação). Veja docs/qualidade.md.

# Código que só compila para wasm32 (ponte com o navegador): os testes nativos não o alcançam.
# Ele é coberto pelos testes no navegador de cada etapa.
exclude_globs = [
    "crates/voice/src/room.rs",
    "crates/api-client/src/ws.rs",
    "web/**",
    # A UI do app desktop é testada à mão em cada etapa (scripts/teste-desktop.ps1).
    "desktop/**",
    "server/src/main.rs",
]
