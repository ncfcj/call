[package]
name = "web"
description = "UI Leptos (CSR) do client. Roda no navegador e dentro do Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# O client só existe no navegador; no alvo nativo o crate compila vazio.
[target.'cfg(target_arch = "wasm32")'.dependencies]
api-client.workspace = true
call-core.workspace = true
console_error_panic_hook.workspace = true
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos.workspace = true
proto.workspace = true
uuid.workspace = true
voice.workspace = true
web-sys = { version = "0.3", features = ["Storage", "KeyboardEvent"] }

[lints]
workspace = true
