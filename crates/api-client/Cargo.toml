[package]
name = "api-client"
description = "Cliente REST e WebSocket da API do call-server (funciona em wasm32)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
proto.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }

[dev-dependencies]
uuid.workspace = true

# A API falsa dos testes de sessão (tests/session.rs) só roda no alvo nativo.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.8"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
