# CodeQL: análise semântica de segurança (gratuita em repositório público). Os alertas aparecem
# em Security > Code scanning e nos PRs. Veja docs/qualidade.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 3"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rust e JS sem build (build-mode none); actions analisa os próprios workflows.
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              # SDK do LiveKit, código de terceiros minificado.
              - web/vendor
              - web/dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
