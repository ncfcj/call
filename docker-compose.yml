# Infra local de desenvolvimento: Postgres + LiveKit em modo dev.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: call
      POSTGRES_PASSWORD: call
      POSTGRES_DB: call
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U call -d call"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    # --dev usa as chaves devkey/secret. --node-ip é o endereço que o LiveKit anuncia para a
    # mídia (WebRTC). Use o IP da máquina na rede local (LIVEKIT_NODE_IP no .env): o Firefox não
    # aceita 127.0.0.1 como candidato ICE, e a chamada fica em "Conectando à voz..." para sempre.
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    # Webhooks de entrou/saiu da sala para o call-server, assinados com a chave devkey.
    # host.docker.internal é a máquina (fora do contêiner).
    environment:
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:3000/livekit/webhook}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
