# cargo-deny: confere as dependências a cada CI. Veja docs/qualidade.md.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# O client roda no navegador: confere também as dependências do alvo wasm32.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]
all-features = true

# Vulnerabilidades e crates abandonados, pela base RustSec.
[advisories]
version = 2
yanked = "deny"
# Cada exceção precisa de um motivo e é revista quando a dependência atualizar.
ignore = [
    # rsa: ataque Marvin (tempo variável no RSA). Vem do jsonwebtoken com a feature
    # rust_crypto, mas o projeto só assina e confere tokens com HMAC (HS256): nem os tokens de
    # sessão nem os do LiveKit usam RSA. Sem versão corrigida do rsa até agora.
    { id = "RUSTSEC-2023-0071", reason = "só HS256; o código RSA do jsonwebtoken nunca roda" },
    # crypto-bigint: tempo variável em operações de curva elíptica (p256/p384), também pelo
    # jsonwebtoken rust_crypto. Mesmo motivo: não usamos ES256/ES384.
    { id = "RUSTSEC-2026-0387", reason = "só HS256; ECDSA do jsonwebtoken nunca roda" },
    # chrono sem manutenção. Vem também do sqlx e da livekit-api (pbjson-types), então trocar só
    # no nosso código não o remove. Migração para time ou jiff anotada nas pendências do plano.
    { id = "RUSTSEC-2026-0543", reason = "transitivo via sqlx e livekit-api; sem substituto ainda" },
]

# Licenças compatíveis com a MIT do projeto. Nenhuma copyleft forte (GPL/AGPL).
[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Versões duplicadas só avisam: acontecem entre dependências e não são um risco por si.
multiple-versions = "warn"
wildcards = "deny"
# Crates do próprio workspace usam caminho, sem versão.
allow-wildcard-paths = true

# Só o crates.io e nenhum repositório git desconhecido.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
